name: Create tagged release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: v1.0.0)"
        required: true
        type: string
      title:
        description: "Release title (optional; defaults to version)"
        required: false
        type: string
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create tag and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate version format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH (example: v1.0.0)."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure main validation succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "main SHA: $SHA"

          conclusion=$(gh run list \
            --repo "$REPO" \
            --workflow "Validate published site" \
            --branch main \
            --commit "$SHA" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')

          if [[ "$conclusion" != "success" ]]; then
            echo "Latest main validation is not successful (found: ${conclusion:-none})."
            exit 1
          fi

      - name: Ensure tag does not already exist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Tags are immutable in this workflow."
            exit 1
          fi

      - name: Create annotated tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "CISSP Study Notes $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          release_title="${TITLE:-$VERSION}"

          if [[ -n "${NOTES:-}" ]]; then
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$release_title" \
              --notes "$NOTES" \
              --verify-tag
          else
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$release_title" \
              --generate-notes \
              --verify-tag
          fi
